<!-- Newsletter Subscription Component -->
<div class="glass-panel rounded-3xl p-8 my-10 bg-white/5 border border-white/10 text-center">
    <h3 class="text-white font-bold text-2xl mb-2">Subscribe to SmartFiQ Insights</h3>
    <p class="text-gray-400 text-sm mb-6 max-w-xl mx-auto">Get weekly AI automation breakdowns, custom Python scrapers, and enterprise workflow guides directly in your inbox.</p>
    <form action="/api/leads" method="post" class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Enter your business email" required class="px-5 py-3 rounded-full bg-white/10 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#ff5625] flex-1 text-sm border border-white/10">
        <button type="submit" class="px-6 py-3 rounded-full bg-gradient-to-r from-[#ff5625] to-[#ff2556] text-white font-semibold text-sm hover:opacity-90 transition-opacity">Subscribe</button>
    </form>
</div>
