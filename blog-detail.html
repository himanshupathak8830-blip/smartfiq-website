<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title id="page-title">Article Detail | Smartfiq AI Automation</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        @keyframes headerSlideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        .animate-header-slide-down {
            animation: headerSlideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .font-plus-jakarta {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #0A0A0A;
            color: #e5e2e1;
            overflow-x: hidden;
        }

        .lava-glow {
            box-shadow: 0 0 50px rgba(255, 86, 37, 0.2);
        }

        .glass-card {
            background: rgba(26, 26, 26, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card:hover {
            border-color: rgba(255, 86, 37, 0.4);
            transform: translateY(-4px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .primary-gradient {
            background: linear-gradient(45deg, #ff5625, #920703);
        }

        .lava-bg-blur {
            filter: blur(90px);
            opacity: 0.18;
            z-index: -1;
        }

        /* Article Prose Formatting */
        .article-prose h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 2.5rem;
            margin-bottom: 1.25rem;
            line-height: 1.3;
        }

        .article-prose h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.35rem;
            font-weight: 600;
            color: #ffb5a0;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .article-prose p {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #e5e2e1;
            margin-bottom: 1.5rem;
        }

        .article-prose strong {
            color: #ffffff;
            font-weight: 600;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffb5a0",
                        "primary-container": "#ff5625",
                        "surface": "#131313",
                        "surface-container-low": "#1c1b1b",
                        "on-surface": "#e5e2e1",
                        "on-surface-variant": "#e7bdb2",
                        "outline": "#ad887e",
                        "background": "#0A0A0A"
                    },
                    spacing: {
                        "container-max": "1200px",
                        "margin-desktop": "64px",
                        "section-gap": "100px"
                    }
                }
            }
        }
    </script>
</head>

<body class="font-body-md text-body-md">
    <!-- Top Navigation Bar -->
    <div id="site-header"></div>

    <main class="relative pt-32 pb-section-gap overflow-hidden min-h-screen">
        <!-- Atmospheric Ambient Glows -->
        <div class="absolute top-0 right-1/4 w-[600px] h-[600px] bg-[#ff5625] rounded-full lava-bg-blur pointer-events-none"></div>
        <div class="absolute top-1/3 left-0 w-[450px] h-[450px] bg-[#920703] rounded-full lava-bg-blur pointer-events-none"></div>

        <!-- ARTICLE CONTAINER -->
        <div id="article-content-container" class="max-w-container-max mx-auto px-6">
            <!-- Loading Spinner Placeholder -->
            <div class="flex flex-col items-center justify-center py-32">
                <div class="w-12 h-12 border-4 border-[#ff5625] border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-on-surface-variant text-sm font-semibold">Loading SmartFiQ Insights...</p>
            </div>
        </div>
    </main>

    <!-- Modal Popup -->
    <div id="site-modal"></div>

    <!-- Footer -->
    <div id="site-footer"></div>

    <!-- Scripts -->
    <script src="components.js"></script>
    <script src="blog-js/blog-data.js"></script>
    <script src="blog.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id');
            const container = document.getElementById('article-content-container');

            if (!articleId) {
                renderNotFound(container, "No Article ID specified.");
                return;
            }

            const article = getArticleById(articleId);

            if (!article) {
                renderNotFound(container, `Article with ID #${articleId} was not found.`);
                return;
            }

            // Set Document Title
            document.title = `${article.title} | SmartFiQ Insights`;

            // Get Related Articles (Exclude current)
            const allArticles = getArticles();
            const related = allArticles.filter(a => Number(a.id) !== Number(article.id)).slice(0, 3);

            let relatedHTML = '';
            if (related.length > 0) {
                relatedHTML = `
                <div class="mt-24 pt-16 border-t border-white/10">
                    <div class="flex items-center justify-between mb-10">
                        <div>
                            <span class="text-[#ff5625] text-xs uppercase tracking-widest font-bold block mb-2">Continue Reading</span>
                            <h3 class="font-headline-lg text-2xl md:text-3xl font-bold text-white">Related Insights</h3>
                        </div>
                        <a href="blog.html" class="inline-flex items-center gap-2 text-[#ffb5a0] hover:text-[#ff5625] text-sm font-semibold transition-colors">
                            View All Articles <span class="material-symbols-outlined text-base">arrow_forward</span>
                        </a>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        ${related.map(rel => `
                            <article class="glass-card rounded-2xl overflow-hidden flex flex-col group transition-all duration-300">
                                <div class="relative h-48 overflow-hidden">
                                    <img src="${rel.coverImage || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600'}" alt="${rel.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                    <span class="absolute top-4 left-4 bg-black/60 backdrop-blur-md text-[#ffb5a0] border border-[#ff5625]/30 text-xs px-3 py-1 rounded-full font-semibold">
                                        ${rel.category || 'AI'}
                                    </span>
                                </div>
                                <div class="p-6 flex flex-col flex-grow justify-between">
                                    <div>
                                        <div class="flex items-center gap-2 text-xs text-[#E7BDB2] mb-3">
                                            <span class="material-symbols-outlined text-sm text-[#ff5625]">schedule</span>
                                            <span>${rel.readTime || '5 min'}</span>
                                            <span>•</span>
                                            <span>${rel.date || '2026'}</span>
                                        </div>
                                        <h4 class="font-bold text-lg text-white group-hover:text-[#ffb5a0] transition-colors mb-3 line-clamp-2">
                                            ${rel.title}
                                        </h4>
                                        <p class="text-xs text-[#E7BDB2] line-clamp-2 mb-4 leading-relaxed">
                                            ${rel.excerpt || ''}
                                        </p>
                                    </div>
                                    <a href="blog-detail.html?id=${rel.id}" class="inline-flex items-center gap-2 text-[#ff5625] text-xs font-bold uppercase tracking-wider group-hover:translate-x-1 transition-transform">
                                        Read Guide <span class="material-symbols-outlined text-sm">arrow_forward</span>
                                    </a>
                                </div>
                            </article>
                        `).join('')}
                    </div>
                </div>
                `;
            }

            // Render Full Article View
            container.innerHTML = `
                <!-- Breadcrumb -->
                <nav class="flex items-center gap-2 text-xs text-[#E7BDB2] mb-8">
                    <a href="index.html" class="hover:text-white transition-colors">Home</a>
                    <span>/</span>
                    <a href="blog.html" class="hover:text-white transition-colors">Insights</a>
                    <span>/</span>
                    <span class="text-[#ffb5a0] font-semibold truncate max-w-xs">${article.category}</span>
                </nav>

                <!-- Article Header -->
                <header class="max-w-4xl mx-auto mb-12">
                    <span class="bg-[#ff5625]/20 text-[#ff5625] border border-[#ff5625]/40 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest inline-block mb-6 backdrop-blur-md">
                        ${article.category}
                    </span>
                    <h1 class="font-headline-lg text-3xl md:text-5xl font-extrabold text-white leading-tight mb-8">
                        ${article.title}
                    </h1>

                    <!-- Author Badge & Publication Info -->
                    <div class="flex flex-wrap items-center justify-between gap-6 p-6 glass-card rounded-2xl">
                        <div class="flex items-center gap-4">
                            <img src="${article.authorAvatar || 'https://lh3.googleusercontent.com/aida-public/AB6AXuASF5UTkQTKGJRQbU_9FSRUWMrkSyz6DoejT6FmdcaMeWwn_H53_y_5OTvVkC0-P3oRsPC3eqQF4vR-Fb7RjB8nuj8o4amNHcJ1nxg2yNo-z0_okpmtHd__Wkv0ChHCmfZuELpf9xTyn7NmybZxm4ZubihpbireIqgh8OVvXcGN5cmp8MXIxuA614DT4XqQsSuSGkmQ0xvvPtQD4oZYI0hyVJIaDmVCQV86sAE8xoyR9mwse_MT93U9'}" alt="${article.author}" class="w-12 h-12 rounded-full object-cover border-2 border-[#ff5625]" />
                            <div>
                                <h4 class="font-bold text-white text-base">${article.author || 'SmartFiQ Architect'}</h4>
                                <p class="text-xs text-[#E7BDB2]">${article.authorRole || 'AI Automation Researcher'}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-6 text-xs text-[#E7BDB2]">
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-[#ff5625] text-lg">calendar_today</span>
                                <span>Published ${article.date || 'July 2026'}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-[#ff5625] text-lg">timer</span>
                                <span>${article.readTime || '8 min read'}</span>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- Cover Image Container with Lava Glow -->
                <div class="max-w-4xl mx-auto mb-16 relative group">
                    <div class="absolute -inset-1 primary-gradient rounded-3xl opacity-30 blur-xl group-hover:opacity-50 transition-opacity"></div>
                    <div class="relative h-[320px] md:h-[480px] rounded-3xl overflow-hidden border border-white/10 glass-card">
                        <img src="${article.coverImage || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200'}" alt="${article.title}" class="w-full h-full object-cover" />
                    </div>
                </div>

                <!-- Article Main Content Body -->
                <article class="max-w-3xl mx-auto article-prose">
                    ${article.content}
                </article>

                <!-- Newsletter Subscription Box -->
                <div class="max-w-3xl mx-auto mt-16 p-8 md:p-12 glass-card rounded-3xl border border-[#ff5625]/30 relative overflow-hidden text-center">
                    <div class="absolute top-0 right-0 w-48 h-48 bg-[#ff5625]/10 rounded-full blur-2xl pointer-events-none"></div>
                    <span class="material-symbols-outlined text-4xl text-[#ff5625] mb-4">mail</span>
                    <h3 class="text-2xl font-bold text-white mb-3">Subscribe to SmartFiQ AI Insights</h3>
                    <p class="text-sm text-[#E7BDB2] max-w-md mx-auto mb-6">
                        Get the latest enterprise AI automation breakdowns, WhatsApp API strategies, and workflow blueprints delivered straight to your inbox.
                    </p>
                    <form class="w-full max-w-lg flex flex-col items-center gap-3 mx-auto" onsubmit="submitNewsletter(event)">
                        <div class="flex flex-col sm:flex-row items-center gap-3 w-full">
                            <input type="email" required placeholder="Enter your work email..." class="w-full sm:w-auto flex-1 px-5 py-3.5 bg-black/70 border border-white/15 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-[#ff5625] text-sm shadow-inner" />
                            <button type="submit" class="w-full sm:w-auto shrink-0 px-7 py-3.5 primary-gradient shine-effect text-white font-bold text-sm rounded-xl whitespace-nowrap hover:scale-105 active:scale-95 transition-all shadow-[0_0_20px_rgba(255,86,37,0.4)] cursor-pointer">
                                Subscribe Now
                            </button>
                        </div>
                        <div class="newsletter-status hidden items-center gap-2 mt-2 px-4 py-2 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 text-xs font-semibold w-full text-center justify-center">
                            <span class="material-symbols-outlined text-sm text-emerald-400">check_circle</span>
                            <span>🎉 Thank you for subscribing! Your email has been registered.</span>
                        </div>
                    </form>
                </div>

                <!-- Related Articles Section -->
                ${relatedHTML}
            `;
        });

        function renderNotFound(container, message) {
            container.innerHTML = `
                <div class="max-w-lg mx-auto py-24 text-center glass-card p-12 rounded-3xl border border-[#ff5625]/30">
                    <span class="material-symbols-outlined text-6xl text-[#ff5625] mb-4">find_in_page</span>
                    <h2 class="text-3xl font-extrabold text-white mb-3">Article Not Found</h2>
                    <p class="text-sm text-[#E7BDB2] mb-8 leading-relaxed">${message}</p>
                    <a href="blog.html" class="inline-flex items-center gap-2 px-8 py-4 primary-gradient text-white text-sm font-bold rounded-xl hover:scale-105 transition-transform shadow-[0_0_25px_rgba(255,86,37,0.4)]">
                        <span class="material-symbols-outlined">arrow_back</span> Return to Insights Hub
                    </a>
                </div>
            `;
        }
    </script>
</body>

</html>
