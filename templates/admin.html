<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartFiQ Leads Admin Panel</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <script src="https://cdn.tailwindcss.com" defer></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080C14; color: #E2E8F0; }
        .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .lava-gradient-text { background: linear-gradient(135deg, #FF6B3D 0%, #FF3D00 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 space-y-8 bg-[#0b0f19] text-gray-200 min-h-screen">

    <!-- Top Admin Header -->
    <header class="max-w-7xl mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 glass-card p-6 rounded-2xl">
        <div class="flex items-center gap-3">
            <img src="/smartfiq-ai-automation-logo.png" alt="SmartFiQ Logo" class="h-8 w-auto" / fetchpriority="high" loading="eager" decoding="async" />
            <div>
                <h1 class="text-xl font-bold text-white">Leads Control Center</h1>
                <p class="text-xs text-gray-400">Live Customer Leads & Newsletter Subscriptions</p>
            </div>
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto">
            <button onclick="fetchLeads()" class="px-4 py-2 text-xs font-semibold text-white bg-white/10 hover:bg-white/20 rounded-xl transition-colors flex items-center gap-2">
                🔄 Refresh Leads
            </button>
            <button onclick="exportCSV()" class="px-5 py-2 text-xs font-bold text-white bg-gradient-to-r from-[#FF6B3D] to-[#FF3D00] rounded-xl hover:scale-105 transition-all shadow-lg">
                📥 Export CSV
            </button>
            <a href="/" class="px-4 py-2 text-xs font-semibold text-gray-300 hover:text-white transition-colors">
                ← Back to Site
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto space-y-8">

        <!-- Stat Cards -->
        <section class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div class="glass-card p-6 rounded-2xl space-y-1">
                <div class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Form Leads</div>
                <div id="stat-form-count" class="text-3xl font-extrabold lava-gradient-text">0</div>
            </div>
            <div class="glass-card p-6 rounded-2xl space-y-1">
                <div class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Subscriber Leads</div>
                <div id="stat-sub-count" class="text-3xl font-extrabold lava-gradient-text">0</div>
            </div>
            <div class="glass-card p-6 rounded-2xl space-y-1">
                <div class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Total Captured</div>
                <div id="stat-total-count" class="text-3xl font-extrabold text-white">0</div>
            </div>
        </section>

        <!-- Search & Filter Controls -->
        <section class="flex flex-col sm:flex-row items-center justify-between gap-4 glass-card p-4 rounded-2xl">
            <!-- Tabs -->
            <div class="flex items-center bg-white/5 p-1 rounded-xl w-full sm:w-auto">
                <button id="tab-form" onclick="switchTab('form')" class="px-5 py-2 text-xs font-bold rounded-lg text-white bg-[#FF6B3D] transition-all">
                    📋 Form Leads (<span id="tab-form-cnt">0</span>)
                </button>
                <button id="tab-sub" onclick="switchTab('sub')" class="px-5 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition-all">
                    📧 Subscribers (<span id="tab-sub-cnt">0</span>)
                </button>
            </div>

            <!-- Search -->
            <div class="w-full sm:w-72">
                <input type="text" id="searchInput" oninput="filterLeads()" placeholder="Search lead name, email, phone..." 
                       class="w-full px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-xs text-white placeholder-gray-500 focus:outline-none focus:border-[#FF6B3D]" />
            </div>
        </section>

        <!-- Form Leads Table -->
        <section id="section-form-leads" class="glass-card rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-white/5 text-gray-400 font-semibold border-b border-white/10 uppercase tracking-wider">
                        <tr>
                            <th class="p-4">Date / Time</th>
                            <th class="p-4">Name</th>
                            <th class="p-4">Email</th>
                            <th class="p-4">Phone</th>
                            <th class="p-4">Budget</th>
                            <th class="p-4">Requirement / Message</th>
                            <th class="p-4">Source</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="form-leads-tbody" class="divide-y divide-white/5 text-gray-300">
                        <tr><td colspan="8" class="p-8 text-center text-gray-500">Loading leads...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Subscriber Leads Table -->
        <section id="section-sub-leads" class="glass-card rounded-2xl overflow-hidden hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-white/5 text-gray-400 font-semibold border-b border-white/10 uppercase tracking-wider">
                        <tr>
                            <th class="p-4">Subscribed Date</th>
                            <th class="p-4">Subscriber Email</th>
                            <th class="p-4">Source</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="sub-leads-tbody" class="divide-y divide-white/5 text-gray-300">
                        <tr><td colspan="4" class="p-8 text-center text-gray-500">Loading subscribers...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        let allFormLeads = [];
        let allSubLeads = [];
        let activeTab = 'form';

        async function fetchLeads() {
            try {
                const res = await fetch('/api/admin/leads');
                const data = await res.json();
                allFormLeads = data.formLeads || [];
                allSubLeads = data.subscribers || [];

                document.getElementById('stat-form-count').innerText = allFormLeads.length;
                document.getElementById('stat-sub-count').innerText = allSubLeads.length;
                document.getElementById('stat-total-count').innerText = allFormLeads.length + allSubLeads.length;

                document.getElementById('tab-form-cnt').innerText = allFormLeads.length;
                document.getElementById('tab-sub-cnt').innerText = allSubLeads.length;

                renderFormLeads(allFormLeads);
                renderSubLeads(allSubLeads);
            } catch (err) {
                console.error('Failed to fetch leads:', err);
            }
        }

        function renderFormLeads(leads) {
            const tbody = document.getElementById('form-leads-tbody');
            if (!leads.length) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-500">No form leads received yet.</td></tr>`;
                return;
            }
            tbody.innerHTML = leads.map(l => `
                <tr class="hover:bg-white/5 transition-colors">
                    <td class="p-4 text-gray-400 whitespace-nowrap">${new Date(l.timestamp || Date.now()).toLocaleString()}</td>
                    <td class="p-4 font-bold text-white">${escapeHtml(l.name || 'N/A')}</td>
                    <td class="p-4 text-[#FF6B3D]">${escapeHtml(l.email || 'N/A')}</td>
                    <td class="p-4 font-mono">${escapeHtml(l.phone || 'N/A')}</td>
                    <td class="p-4"><span class="px-2 py-1 bg-green-500/20 text-green-400 rounded-md font-semibold">${escapeHtml(l.budget || 'N/A')}</span></td>
                    <td class="p-4 max-w-xs truncate" title="${escapeHtml(l.message || l.requirement_details || '')}">${escapeHtml(l.message || l.requirement_details || 'N/A')}</td>
                    <td class="p-4 text-gray-400">${escapeHtml(l.source || 'Website')}</td>
                    <td class="p-4 text-right">
                        <button onclick="deleteLead('form', '${l.id}')" class="text-red-400 hover:text-red-300 font-medium">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderSubLeads(subs) {
            const tbody = document.getElementById('sub-leads-tbody');
            if (!subs.length) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-500">No newsletter subscribers yet.</td></tr>`;
                return;
            }
            tbody.innerHTML = subs.map(s => `
                <tr class="hover:bg-white/5 transition-colors">
                    <td class="p-4 text-gray-400 whitespace-nowrap">${new Date(s.timestamp || Date.now()).toLocaleString()}</td>
                    <td class="p-4 font-bold text-[#FF6B3D]">${escapeHtml(s.email || 'N/A')}</td>
                    <td class="p-4 text-gray-400">${escapeHtml(s.source || 'Footer')}</td>
                    <td class="p-4 text-right">
                        <button onclick="deleteLead('sub', '${s.id}')" class="text-red-400 hover:text-red-300 font-medium">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function switchTab(tab) {
            activeTab = tab;
            const btnForm = document.getElementById('tab-form');
            const btnSub = document.getElementById('tab-sub');
            const secForm = document.getElementById('section-form-leads');
            const secSub = document.getElementById('section-sub-leads');

            if (tab === 'form') {
                btnForm.className = 'px-5 py-2 text-xs font-bold rounded-lg text-white bg-[#FF6B3D] transition-all';
                btnSub.className = 'px-5 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition-all';
                secForm.classList.remove('hidden');
                secSub.classList.add('hidden');
            } else {
                btnSub.className = 'px-5 py-2 text-xs font-bold rounded-lg text-white bg-[#FF6B3D] transition-all';
                btnForm.className = 'px-5 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition-all';
                secSub.classList.remove('hidden');
                secForm.classList.add('hidden');
            }
        }

        function filterLeads() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (activeTab === 'form') {
                const filtered = allFormLeads.filter(l => 
                    (l.name && l.name.toLowerCase().includes(query)) ||
                    (l.email && l.email.toLowerCase().includes(query)) ||
                    (l.phone && l.phone.toLowerCase().includes(query)) ||
                    (l.message && l.message.toLowerCase().includes(query))
                );
                renderFormLeads(filtered);
            } else {
                const filtered = allSubLeads.filter(s => s.email && s.email.toLowerCase().includes(query));
                renderSubLeads(filtered);
            }
        }

        async function deleteLead(type, id) {
            if (!confirm('Are you sure you want to delete this lead?')) return;
            try {
                await fetch(`/api/admin/leads/${type}/${id}`, { method: 'DELETE' });
                fetchLeads();
            } catch (err) {
                console.error('Delete lead error:', err);
            }
        }

        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            if (activeTab === 'form') {
                csvContent += "Date,Name,Email,Phone,Budget,Message,Source\n";
                allFormLeads.forEach(l => {
                    csvContent += `"${l.timestamp}","${l.name || ''}","${l.email || ''}","${l.phone || ''}","${l.budget || ''}","${(l.message || '').replace(/"/g, '""')}","${l.source || ''}"\n`;
                });
            } else {
                csvContent += "Date,Subscriber Email,Source\n";
                allSubLeads.forEach(s => {
                    csvContent += `"${s.timestamp}","${s.email || ''}","${s.source || ''}"\n`;
                });
            }
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `smartfiq_${activeTab}_leads.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        document.addEventListener('DOMContentLoaded', fetchLeads);
    </script>
</body>
</html>
